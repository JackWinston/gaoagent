[project]
name = "gaoagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "modelcontextprotocol",
  "chromadb>=0.5",
]

[project.scripts]
gaoagent = "gaoagent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaoagent"]
