[project]
name = "gaoagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "modelcontextprotocol",
  "chromadb==1.5.8",
  "a2a-sdk>=1.0.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "starlette>=0.40.0",
]

[project.scripts]
gaoagent = "gaoagent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaoagent"]
